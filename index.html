<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Tracker Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 15px; color: var(--accent-color); font-size: 2rem; text-align: center; }

        .container { width: 100%; max-width: 1000px; }

        /* شريط نسبة الإنجاز */
        .progress-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: bold; }
        .progress-bar-bg { background: #0f172a; height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #38bdf8, #10b981); height: 100%; width: 0%; transition: width 0.4s ease; }

        /* شريط المقولة والتايمر */
        .productivity-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e293b; border: 1px solid #334155; padding: 12px 20px;
            border-radius: 12px; margin-bottom: 20px; gap: 15px; flex-wrap: wrap;
        }
        .quote-box { flex: 1; font-style: italic; color: #cbd5e1; font-size: 0.95rem; }
        .timer-box { display: flex; align-items: center; gap: 10px; background: #0f172a; padding: 6px 14px; border-radius: 8px; }
        #timerDisplay { font-size: 1.3rem; font-weight: bold; color: #38bdf8; font-family: monospace; }

        /* التحكم والإدخال */
        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input, select, button {
            padding: 10px 14px; border-radius: 8px; border: 1px solid #334155;
            background: #1e293b; color: white; outline: none; font-size: 0.95rem;
        }
        input[type="text"] { flex: 2; min-width: 200px; }
        button { background: #0284c7; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #0369a1; }

        /* البحث والفلترة */
        .filter-row { display: flex; gap: 10px; margin-bottom: 25px; }
        .filter-row input { flex: 1; background: #0f172a; }

        /* اللوحة والعواميد */
        .board { display: flex; gap: 20px; justify-content: center; align-items: flex-start; }
        .column {
            background-color: #1e293b80; border: 1px solid #334155; width: 320px;
            min-height: 400px; padding: 15px; border-radius: 12px; backdrop-filter: blur(8px);
        }
        .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .badge { background: #334155; padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; }

        /* كروت المهام */
        .task-list { min-height: 350px; }
        .task {
            background-color: #334155; padding: 12px 14px; margin-bottom: 10px; border-radius: 8px;
            cursor: grab; display: flex; flex-direction: column; gap: 6px; transition: 0.2s;
        }
        .task:hover { transform: translateY(-2px); }
        .task-header { display: flex; justify-content: space-between; align-items: center; }
        .task-footer { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; }

        .priority-high { border-right: 4px solid #ef4444; }
        .priority-medium { border-right: 4px solid #f59e0b; }
        .priority-low { border-right: 4px solid #10b981; }

        .delete-btn { background: transparent; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 0; }
        .delete-btn:hover { color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 Academic Tracker </h1>

        <!-- شريط التقدم -->
        <div class="progress-box">
            <div class="progress-info">
                <span>نسبة إنجاز الخطة</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- المقولات والتايمر -->
        <div class="productivity-bar">
            <div class="quote-box" id="quoteText">"النجاح هو محصلة اجتهادات صغيرة تتكرر كل يوم."</div>
            <div class="timer-box">
                <span id="timerDisplay">25:00</span>
                <button onclick="toggleTimer()" id="timerBtn">بدء ⏱️</button>
            </div>
        </div>

        <!-- إضافة مهمة جديدة -->
        <div class="controls-row">
            <input type="text" id="taskInput" placeholder="عنوان المهمة الجديدة...">
            <input type="date" id="dueDateInput">
            <select id="prioritySelect">
                <option value="high">أولوية عالية 🔥</option>
                <option value="medium" selected>أولوية متوسطة ⚡</option>
                <option value="low">أولوية منخفضة ☕</option>
            </select>
            <button onclick="addNewTask()">إضافة +</button>
        </div>

        <!-- البحث والفلترة -->
        <div class="filter-row">
            <input type="text" id="searchInput" placeholder="🔍 بحث في المهام..." oninput="applyFilters()">
            <select id="filterPriority" onchange="applyFilters()">
                <option value="all">كل الأولويات</option>
                <option value="high">عالية 🔥</option>
                <option value="medium">متوسطة ⚡</option>
                <option value="low">منخفضة ☕</option>
            </select>
        </div>

        <!-- العواميد -->
        <div class="board">
            <div class="column" id="todo" ondragover="allowDrop(event)" ondrop="drop(event)">
                <div class="column-header">
                    <h3>📝 للمتابعة</h3>
                    <span class="badge" id="count-todo">0</span>
                </div>
                <div class="task-list"></div>
            </div>

            <div class="column" id="in-progress" ondragover="allowDrop(event)" ondrop="drop(event)">
                <div class="column-header">
                    <h3>⏳ جاري التنفيذ</h3>
                    <span class="badge" id="count-in-progress">0</span>
                </div>
                <div class="task-list"></div>
            </div>

            <div class="column" id="done" ondragover="allowDrop(event)" ondrop="drop(event)">
                <div class="column-header">
                    <h3>✅ المكتملة</h3>
                    <span class="badge" id="count-done">0</span>
                </div>
                <div class="task-list"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
